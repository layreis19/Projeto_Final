<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme · Perfil</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-femme">
    <div class="container">
      <a class="navbar-brand" href="index.html">Femme</a>
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="nav-link" href="index.html">Descobrir</a>
        <a class="nav-link" href="agenda.html">A Minha Agenda</a>
        <span id="userBox"></span>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div id="conteudo"><p class="text-muted">A carregar...</p></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const userBox = document.getElementById("userBox");
    const user = Sessao.utilizador();
    userBox.innerHTML = user ? `Olá, ${user.nome}` : `<a class="btn btn-outline-primary btn-sm" href="login.html">Entrar</a>`;

    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    async function carregar() {
      const conteudo = document.getElementById("conteudo");
      try {
        const [p, avaliacoes] = await Promise.all([
          apiFetch(`/profissionais/${id}`, { auth: false }),
          apiFetch(`/profissionais/${id}/avaliacoes`, { auth: false }),
        ]);

        conteudo.innerHTML = `
          <div class="d-flex gap-3 align-items-center mb-2">
            <div class="avatar-placeholder" style="width:64px;height:64px;"></div>
            <div>
              <h1 class="font-display mb-1">${p.nome_negocio}</h1>
              <div style="color:var(--femme-gold);">${"★".repeat(Math.round(p.classificacao_media)) || "☆"}
                <span class="text-muted small">(${p.total_avaliacoes} avaliações)</span></div>
            </div>
          </div>
          <p class="text-muted" style="max-width:520px;">${p.bio || ""}</p>
          <p class="small text-muted">${p.categoria || ""} · ${p.localizacao || ""}</p>

          <h2 class="font-display h4 mt-5">Serviços</h2>
          <div class="card card-femme">
            <div class="list-group list-group-flush">
              ${p.servicos.map(s => `
                <div class="list-group-item d-flex align-items-center gap-3">
                  <div class="flex-grow-1">
                    <div class="fw-semibold">${s.nome}</div>
                    <div class="small text-muted">${s.duracao_minutos} min</div>
                  </div>
                  <div class="fw-semibold">${s.preco.toFixed(2)}€</div>
                  <button class="btn btn-primary btn-sm" onclick="location.href='marcar.html?servico=${s.id}'">Marcar</button>
                </div>
              `).join("") || `<div class="list-group-item text-muted">Sem serviços publicados.</div>`}
            </div>
          </div>

          <h2 class="font-display h4 mt-5">Avaliações</h2>
          <div class="row g-3">
            ${avaliacoes.map(a => `
              <div class="col-12 col-md-6">
                <div class="card card-femme p-3">
                  <div style="color:var(--femme-gold);">${"★".repeat(a.classificacao)}${"☆".repeat(5-a.classificacao)}</div>
                  <div class="small mt-1">${a.comentario || ""}</div>
                  <div class="small text-muted mt-1">${a.cliente_nome}</div>
                </div>
              </div>
            `).join("") || `<p class="text-muted">Ainda sem avaliações publicadas.</p>`}
          </div>
        `;
      } catch (err) {
        conteudo.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }
    carregar();
  </script>
</body>
</html>
