<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme · Confirmar marcação</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-femme">
    <div class="container">
      <a class="navbar-brand" href="index.html">Femme</a>
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="nav-link" href="index.html">Descobrir</a>
        <a class="nav-link" href="agenda.html">A Minha Agenda</a>
        <span id="userBox"></span>
      </div>
    </div>
  </nav>

  <main class="container py-5" style="max-width:440px;">
    <h1 class="font-display">Confirmar marcação</h1>
    <div id="msgBox"></div>
    <div id="conteudo"><p class="text-muted">A carregar...</p></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const user = Sessao.exigirTipo("cliente", "login.html");
    document.getElementById("userBox").innerHTML = `Olá, ${user.nome}`;

    const params = new URLSearchParams(location.search);
    const idServico = params.get("servico");

    async function carregar() {
      const conteudo = document.getElementById("conteudo");
      const servico = await apiFetch(`/servicos/${idServico}`, { auth: false });

      conteudo.innerHTML = `
        <div class="card card-femme p-4">
          <div class="mb-3">
            <div class="fw-semibold">${servico.nome} · ${servico.preco.toFixed(2)}€</div>
            <div class="small text-muted">${servico.duracao_minutos} min · com ${servico.profissional_nome}</div>
          </div>
          <div class="mb-3">
            <label class="form-label small text-muted">Data e hora</label>
            <input type="datetime-local" id="dataHora" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label small text-muted">Notas (opcional)</label>
            <textarea id="notas" class="form-control" rows="2"></textarea>
          </div>
          <button class="btn btn-primary w-100" id="confirmarBtn">Confirmar pedido</button>
          <p class="small text-muted mt-3 mb-0">A profissional confirma a marcação depois. Vais receber uma notificação.</p>
        </div>
      `;

      document.getElementById("confirmarBtn").addEventListener("click", async () => {
        const msgBox = document.getElementById("msgBox");
        const dataHora = document.getElementById("dataHora").value;
        if (!dataHora) { alertaErro(msgBox, "Escolhe uma data e hora."); return; }
        try {
          await apiFetch("/marcacoes", {
            method: "POST",
            body: { id_servico: Number(idServico), data_hora: dataHora, notas: document.getElementById("notas").value },
          });
          alertaSucesso(msgBox, "Pedido enviado! Acompanha o estado em 'A Minha Agenda'.");
          setTimeout(() => location.href = "agenda.html", 1200);
        } catch (err) {
          alertaErro(msgBox, err.message);
        }
      });
    }
    carregar();
  </script>
</body>
</html>
