<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme · Entrar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-femme">
    <div class="container">
      <a class="navbar-brand" href="index.html">Femme</a>
    </div>
  </nav>

  <main class="container py-5" style="max-width:380px;">
    <h1 class="font-display">Bem-vinda de volta</h1>
    <p class="text-muted mb-4">Entra para gerir as tuas marcações.</p>

    <div id="msgBox"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label small text-muted">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Palavra-passe</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
    <p class="small mt-3">Ainda não tens conta? <a href="registo.html" class="fw-semibold" style="color:var(--bs-primary);">Registar</a></p>
    <p class="small text-muted mt-4">Demo: ana.costa@gmail.com / cliente123</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msgBox = document.getElementById("msgBox");
      try {
        const data = await apiFetch("/auth/login", {
          method: "POST", auth: false,
          body: { email: email.value, password: password.value },
        });
        if (data.utilizador.tipo !== "cliente") {
          alertaErro(msgBox, "Esta conta não é de cliente. Usa a área da profissional.");
          return;
        }
        Sessao.guardar(data.token, data.utilizador);
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get("next") || "index.html";
      } catch (err) {
        alertaErro(msgBox, err.message);
      }
    });
  </script>
</body>
</html>
