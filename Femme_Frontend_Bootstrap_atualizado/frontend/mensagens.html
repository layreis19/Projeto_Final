<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme · Mensagens</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-femme">
    <div class="container">
      <a class="navbar-brand" href="index.html">Femme</a>
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="nav-link" href="index.html">Descobrir</a>
        <a class="nav-link" href="agenda.html">A Minha Agenda</a>
        <span id="userBox"></span>
      </div>
    </div>
  </nav>

  <main class="container py-5" style="max-width:520px;">
    <h1 class="font-display h3">Mensagens</h1>
    <p class="text-muted small mb-4">Conversa associada a esta marcação.</p>
    <div id="msgBox"></div>

    <div class="card card-femme p-3 mb-3" id="conversa" style="min-height:280px;max-height:420px;overflow-y:auto;">
      <p class="text-muted">A carregar...</p>
    </div>

    <form id="enviarForm" class="d-flex gap-2">
      <input type="text" id="conteudo" class="form-control" placeholder="Escrever mensagem...">
      <button class="btn btn-primary">Enviar</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const user = Sessao.utilizador();
    if (!user || !Sessao.token()) window.location.href = "login.html";
    document.getElementById("userBox").innerHTML = `Olá, ${user.nome}`;

    const params = new URLSearchParams(location.search);
    const idMarcacao = params.get("marcacao");

    async function carregar() {
      const conversa = document.getElementById("conversa");
      try {
        const mensagens = await apiFetch(`/marcacoes/${idMarcacao}/mensagens`);
        conversa.innerHTML = mensagens.length ? mensagens.map(m => `
          <div class="msg-bubble ${m.id_remetente === user.id ? "me" : "them"} mb-2">${m.conteudo}</div>
        `).join("") : `<p class="text-muted">Ainda sem mensagens. Diz olá!</p>`;
        conversa.scrollTop = conversa.scrollHeight;
      } catch (err) {
        conversa.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    document.getElementById("enviarForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("conteudo");
      if (!input.value.trim()) return;
      try {
        await apiFetch(`/marcacoes/${idMarcacao}/mensagens`, { method: "POST", body: { conteudo: input.value } });
        input.value = "";
        carregar();
      } catch (err) {
        alertaErro(document.getElementById("msgBox"), err.message);
      }
    });

    carregar();
  </script>
</body>
</html>
