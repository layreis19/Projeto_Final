<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme · Profissional · Agenda</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  .cal-day{ border:1px solid rgba(122,36,54,.12); border-radius:.5rem; min-height:110px; padding:.35rem; font-size:.72rem; }
  .cal-day.today{ border-color:var(--bs-primary); background:#FBF4F0; }
  .cal-event{ background:var(--bs-secondary); color:#fff; border-radius:.3rem; padding:2px 5px; margin-bottom:3px; font-weight:600; line-height:1.2; }
  .cal-more{ font-size:.68rem; opacity:.65; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-femme">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Femme · Profissional</a>
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="nav-link" href="pagina.html">Perfil</a>
        <a class="nav-link" href="servicos.html">Serviços</a>
        <a class="nav-link fw-semibold" href="agenda.html">Agenda</a>
        <a class="nav-link" href="mensagens.html">Mensagens</a>
        <span id="userBox"></span>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="font-display">Agenda</h1>
    <div id="msgBox"></div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div id="calendario" class="row row-cols-7 g-2"></div>
        <p class="small text-muted mt-2">Um dia cheio mostra as primeiras marcações + "+N mais", que abre a lista completa desse dia.</p>
      </div>
      <div class="col-lg-4">
        <div class="card card-femme p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>Pedidos pendentes</strong>
            <span class="badge text-bg-primary" id="pendCount">0</span>
          </div>
          <div id="pendentes"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: lista completa de um dia -->
  <div class="modal fade" id="diaModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title font-display" id="diaModalTitulo">Dia</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><div id="diaModalLista" class="list-group list-group-flush"></div></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script>
    const user = Sessao.exigirTipo("profissional", "login.html");
    document.getElementById("userBox").innerHTML = `Olá, ${user.nome}`;
    const diaModal = new bootstrap.Modal(document.getElementById("diaModal"));

    function inicioDaSemana(d) {
      const dia = new Date(d);
      const diff = dia.getDate() - dia.getDay() + 1; // segunda-feira
      return new Date(dia.setDate(diff));
    }

    async function carregar() {
      const [confirmadas, pendentes] = await Promise.all([
        apiFetch("/profissional/marcacoes?estado=confirmada"),
        apiFetch("/profissional/marcacoes?estado=pendente"),
      ]);

      // -- Painel de pendentes --
      document.getElementById("pendCount").textContent = pendentes.length;
      document.getElementById("pendentes").innerHTML = pendentes.length ? pendentes.map(m => `
        <div class="border rounded p-2 mb-2">
          <div class="fw-semibold small">${m.cliente_nome}</div>
          <div class="text-muted small mb-2">${m.servico_nome} · ${formatarData(m.data_hora)}</div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary btn-sm flex-fill" onclick="mudarEstado(${m.id},'confirmada')">Aceitar</button>
            <button class="btn btn-outline-primary btn-sm flex-fill" onclick="mudarEstado(${m.id},'recusada')">Recusar</button>
          </div>
        </div>
      `).join("") : `<p class="text-muted small">Sem pedidos pendentes.</p>`;

      // -- Calendário semanal (marcações confirmadas) --
      const inicio = inicioDaSemana(new Date());
      const dias = Array.from({length:7}, (_,i) => { const d = new Date(inicio); d.setDate(inicio.getDate()+i); return d; });
      const hoje = new Date().toDateString();
      const nomesDias = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];

      const cal = document.getElementById("calendario");
      cal.innerHTML = dias.map((d, i) => {
        const doDia = confirmadas.filter(m => new Date(m.data_hora).toDateString() === d.toDateString());
        const visiveis = doDia.slice(0, 3);
        const resto = doDia.length - visiveis.length;
        return `
          <div class="col">
            <div class="small text-muted text-center mb-1">${nomesDias[i]}</div>
            <div class="cal-day ${d.toDateString() === hoje ? "today" : ""}">
              <div class="text-muted" style="font-size:.65rem;">${d.getDate()}</div>
              ${visiveis.map(m => `<div class="cal-event">${new Date(m.data_hora).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})} ${m.cliente_nome.split(" ")[0]}</div>`).join("")}
              ${resto > 0 ? `<div class="cal-more" onclick='abrirDia("${d.toDateString()}", ${JSON.stringify(doDia).replace(/'/g,"&#39;")})'>+${resto} mais</div>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    function abrirDia(dataStr, marcacoesDoDia) {
      document.getElementById("diaModalTitulo").textContent = new Date(dataStr).toLocaleDateString("pt-PT", { weekday:"long", day:"2-digit", month:"long" });
      document.getElementById("diaModalLista").innerHTML = marcacoesDoDia.map(m => `
        <div class="list-group-item d-flex justify-content-between">
          <span>${new Date(m.data_hora).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})} · ${m.cliente_nome}</span>
          <span class="text-muted">${m.servico_nome}</span>
        </div>
      `).join("");
      diaModal.show();
    }

    async function mudarEstado(id, estado) {
      const msgBox = document.getElementById("msgBox");
      try {
        await apiFetch(`/profissional/marcacoes/${id}/estado`, { method: "PUT", body: { estado } });
        carregar();
      } catch (err) { alertaErro(msgBox, err.message); }
    }

    carregar();
  </script>
</body>
</html>
