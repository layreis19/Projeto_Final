<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme · Profissional · Mensagens</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-femme">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Femme · Profissional</a>
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="nav-link" href="pagina.html">Perfil</a>
        <a class="nav-link" href="servicos.html">Serviços</a>
        <a class="nav-link" href="agenda.html">Agenda</a>
        <a class="nav-link fw-semibold" href="mensagens.html">Mensagens</a>
        <span id="userBox"></span>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="font-display">Mensagens</h1>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card card-femme"><div id="listaConversas" class="list-group list-group-flush"></div></div>
      </div>
      <div class="col-md-8">
        <div id="msgBox"></div>
        <div class="card card-femme p-3 mb-3" id="conversa" style="min-height:280px;max-height:420px;overflow-y:auto;">
          <p class="text-muted">Escolhe uma conversa à esquerda.</p>
        </div>
        <form id="enviarForm" class="d-flex gap-2" style="display:none!important;">
          <input type="text" id="conteudo" class="form-control" placeholder="Escrever mensagem...">
          <button class="btn btn-primary">Enviar</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script>
    const user = Sessao.exigirTipo("profissional", "login.html");
    document.getElementById("userBox").innerHTML = `Olá, ${user.nome}`;
    let idMarcacaoAtual = null;

    async function carregarConversas() {
      // Reaproveita as marcações (cada uma pode ter uma conversa associada)
      const marcacoes = await apiFetch("/profissional/marcacoes");
      const lista = document.getElementById("listaConversas");
      lista.innerHTML = marcacoes.length ? marcacoes.map(m => `
        <button class="list-group-item list-group-item-action" onclick="abrirConversa(${m.id}, this)">
          <div class="fw-semibold small">${m.cliente_nome}</div>
          <div class="text-muted" style="font-size:.78rem;">${m.servico_nome} · ${formatarData(m.data_hora)}</div>
        </button>
      `).join("") : `<div class="list-group-item text-muted">Sem marcações ainda.</div>`;
    }

    async function abrirConversa(idMarcacao, btn) {
      idMarcacaoAtual = idMarcacao;
      document.querySelectorAll("#listaConversas .list-group-item").forEach(el => el.classList.remove("active"));
      if (btn) btn.classList.add("active");
      document.getElementById("enviarForm").style.setProperty("display", "flex", "important");
      await carregarMensagens();
    }

    async function carregarMensagens() {
      const conversa = document.getElementById("conversa");
      const mensagens = await apiFetch(`/marcacoes/${idMarcacaoAtual}/mensagens`);
      conversa.innerHTML = mensagens.length ? mensagens.map(m => `
        <div class="msg-bubble ${m.id_remetente === user.id ? "me" : "them"} mb-2">${m.conteudo}</div>
      `).join("") : `<p class="text-muted">Ainda sem mensagens.</p>`;
      conversa.scrollTop = conversa.scrollHeight;
    }

    document.getElementById("enviarForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("conteudo");
      if (!input.value.trim() || !idMarcacaoAtual) return;
      try {
        await apiFetch(`/marcacoes/${idMarcacaoAtual}/mensagens`, { method: "POST", body: { conteudo: input.value } });
        input.value = "";
        carregarMensagens();
      } catch (err) { alertaErro(document.getElementById("msgBox"), err.message); }
    });

    carregarConversas();
  </script>
</body>
</html>
