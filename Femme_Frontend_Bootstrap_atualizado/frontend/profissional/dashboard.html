<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme · Profissional · Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-femme">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Femme · Profissional</a>
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="nav-link fw-semibold" href="pagina.html">Perfil</a>
        <a class="nav-link" href="servicos.html">Serviços</a>
        <a class="nav-link" href="agenda.html">Agenda</a>
        <a class="nav-link" href="mensagens.html">Mensagens</a>
        <span id="userBox"></span>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="font-display">Dashboard</h1>
    <div id="estadoPerfil" class="mb-3"></div>
    <div class="row g-3 mb-4" id="stats"></div>
    <p class="text-muted small" id="nota"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script>
    const user = Sessao.exigirTipo("profissional", "login.html");
    document.getElementById("userBox").innerHTML = `Olá, ${user.nome} · <a href="#" id="logoutLink">sair</a>`;
    document.getElementById("logoutLink").onclick = () => { Sessao.terminar(); location.href = "login.html"; };

    async function carregar() {
      const dash = await apiFetch("/profissional/dashboard");

      const estados = { pendente: ["warning","Perfil pendente de aprovação"], aprovado: ["success","Perfil aprovado e visível"], rejeitado: ["secondary","Perfil rejeitado — edita e reenvia"] };
      const [cor, texto] = estados[dash.estado_perfil] || ["secondary", dash.estado_perfil];
      document.getElementById("estadoPerfil").innerHTML = `<span class="badge text-bg-${cor} px-3 py-2">${texto}</span>`;

      document.getElementById("stats").innerHTML = `
        <div class="col-6 col-md-3"><div class="card card-femme p-3 text-center">
          <div class="font-display h3 mb-0" style="color:var(--bs-primary);">${dash.marcacoes_ativas}</div>
          <div class="small text-muted text-uppercase">Marcações ativas</div></div></div>
        <div class="col-6 col-md-3"><div class="card card-femme p-3 text-center">
          <div class="font-display h3 mb-0" style="color:var(--bs-primary);">${dash.classificacao_media || "—"}</div>
          <div class="small text-muted text-uppercase">Avaliação média</div></div></div>
        <div class="col-6 col-md-3"><div class="card card-femme p-3 text-center">
          <div class="font-display h3 mb-0" style="color:var(--bs-primary);">${dash.total_avaliacoes}</div>
          <div class="small text-muted text-uppercase">Avaliações publicadas</div></div></div>
        <div class="col-6 col-md-3"><div class="card card-femme p-3 text-center">
          <div class="font-display h3 mb-0" style="color:var(--bs-primary);">${dash.avaliacoes_por_moderar}</div>
          <div class="small text-muted text-uppercase">A aguardar moderação</div></div></div>
      `;

      if (dash.estado_perfil === "pendente") {
        document.getElementById("nota").textContent = "O teu perfil ainda não está visível para clientes. Um administrador vai validar os dados em breve.";
      }
    }
    carregar();
  </script>
</body>
</html>
