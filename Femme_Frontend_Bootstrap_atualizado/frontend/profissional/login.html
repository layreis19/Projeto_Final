<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme · Profissional · Entrar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-femme">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Femme · Profissional</a>
      <a class="nav-link ms-auto" href="../index.html">Sou cliente</a>
    </div>
  </nav>

  <main class="container py-5" style="max-width:380px;">
    <h1 class="font-display h3">Área da Profissional</h1>
    <p class="text-muted mb-4">Gerir perfil, serviços e agenda.</p>

    <div id="msgBox"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label small text-muted">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-muted">Palavra-passe</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
    <p class="small mt-3">Ainda não é parceira? <a href="../registo.html" class="fw-semibold" style="color:var(--bs-primary);">Candidatar perfil</a></p>
    <p class="small text-muted mt-4">Demo: ines.marques@femme.pt / profissional123</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msgBox = document.getElementById("msgBox");
      try {
        const data = await apiFetch("/auth/login", { method: "POST", auth: false,
          body: { email: email.value, password: password.value } });
        if (data.utilizador.tipo !== "profissional") {
          alertaErro(msgBox, "Esta conta não é de profissional.");
          return;
        }
        Sessao.guardar(data.token, data.utilizador);
        window.location.href = "dashboard.html";
      } catch (err) { alertaErro(msgBox, err.message); }
    });
  </script>
</body>
</html>
