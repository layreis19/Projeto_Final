<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme · Profissional · Serviços</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-femme">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Femme · Profissional</a>
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="nav-link" href="pagina.html">Perfil</a>
        <a class="nav-link fw-semibold" href="servicos.html">Serviços</a>
        <a class="nav-link" href="agenda.html">Agenda</a>
        <a class="nav-link" href="mensagens.html">Mensagens</a>
        <span id="userBox"></span>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="font-display mb-0">Gestão de serviços</h1>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#novoServicoModal">+ Novo serviço</button>
    </div>
    <div id="msgBox"></div>
    <div class="card card-femme"><div id="listaServicos" class="list-group list-group-flush"></div></div>
  </main>

  <div class="modal fade" id="novoServicoModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title font-display">Novo serviço</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="modalMsg"></div>
          <div class="mb-3"><label class="form-label small text-muted">Nome</label><input id="s_nome" class="form-control"></div>
          <div class="mb-3"><label class="form-label small text-muted">Categoria</label><select id="s_categoria" class="form-select"></select></div>
          <div class="row g-2 mb-3">
            <div class="col-6"><label class="form-label small text-muted">Duração (min)</label><input type="number" id="s_duracao" class="form-control"></div>
            <div class="col-6"><label class="form-label small text-muted">Preço (€)</label><input type="number" step="0.01" id="s_preco" class="form-control"></div>
          </div>
          <div class="mb-1"><label class="form-label small text-muted">Descrição</label><textarea id="s_descricao" class="form-control" rows="2"></textarea></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-primary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" id="criarServicoBtn">Criar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script>
    const user = Sessao.exigirTipo("profissional", "login.html");
    document.getElementById("userBox").innerHTML = `Olá, ${user.nome}`;
    const modalNovo = new bootstrap.Modal(document.getElementById("novoServicoModal"));

    async function carregarCategorias() {
      const categorias = await apiFetch("/categorias", { auth: false });
      document.getElementById("s_categoria").innerHTML = categorias.map(c => `<option value="${c.id}">${c.nome}</option>`).join("");
    }

    async function carregar() {
      const servicos = await apiFetch("/profissional/servicos");
      document.getElementById("listaServicos").innerHTML = servicos.length ? servicos.map(s => `
        <div class="list-group-item d-flex align-items-center gap-3">
          <div class="flex-grow-1">
            <div class="fw-semibold">${s.nome} ${s.ativo ? "" : '<span class="badge text-bg-secondary">inativo</span>'}</div>
            <div class="small text-muted">${s.duracao_minutos} min · ${s.preco.toFixed(2)}€</div>
          </div>
          ${s.ativo ? `<button class="btn btn-outline-primary btn-sm" onclick="desativar(${s.id})">Desativar</button>` : ""}
        </div>
      `).join("") : `<div class="list-group-item text-muted">Ainda sem serviços — cria o primeiro.</div>`;
    }

    async function desativar(id) {
      await apiFetch(`/profissional/servicos/${id}`, { method: "DELETE" });
      carregar();
    }

    document.getElementById("criarServicoBtn").addEventListener("click", async () => {
      const modalMsg = document.getElementById("modalMsg");
      try {
        await apiFetch("/profissional/servicos", {
          method: "POST",
          body: {
            nome: s_nome.value, id_categoria: Number(s_categoria.value),
            duracao_minutos: Number(s_duracao.value), preco: Number(s_preco.value),
            descricao: s_descricao.value,
          },
        });
        modalNovo.hide();
        s_nome.value = s_duracao.value = s_preco.value = s_descricao.value = "";
        carregar();
      } catch (err) { alertaErro(modalMsg, err.message); }
    });

    carregarCategorias();
    carregar();
  </script>
</body>
</html>
