<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme · Descobrir</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-femme">
    <div class="container">
      <a class="navbar-brand" href="index.html">Femme</a>
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="nav-link" href="index.html">Descobrir</a>
        <a class="nav-link" href="agenda.html">A Minha Agenda</a>
        <a class="nav-link" href="profissional/login.html">Sou profissional</a>
        <span id="userBox" class="ms-2"></span>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="font-display">Descobrir profissionais</h1>
    <p class="text-muted mb-4">Pesquisa por nome ou filtra por categoria.</p>

    <input type="text" id="pesquisa" class="form-control mb-3" style="max-width:420px;" placeholder="🔍 Pesquisar profissional...">
    <div id="categorias" class="mb-4"></div>
    <div id="resultado" class="row g-3"><p class="text-muted">A carregar...</p></div>
  </main>

  <footer class="femme-footer">Femme / BloomBook — frontend Bootstrap ligado à API</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    // A pesquisa/descoberta de profissionais só fica disponível depois de login.
    const user = Sessao.exigirLogin("login.html");
    if (!user) {
      // exigirLogin já redireciona para login.html; interrompe a execução do resto da página.
      throw new Error("Sessão não iniciada — a redirecionar para login.");
    }

    const userBox = document.getElementById("userBox");
    userBox.innerHTML = `Olá, ${user.nome} · <a href="#" id="logoutLink">sair</a>`;
    document.getElementById("logoutLink").onclick = () => { Sessao.terminar(); location.href = "login.html"; };

    let categoriaAtiva = null;

    async function carregarCategorias() {
      const categorias = await apiFetch("/categorias", { auth: false });
      const box = document.getElementById("categorias");
      box.innerHTML = categorias.map(c =>
        `<span class="badge rounded-pill text-bg-light border chip-cat me-2 py-2 px-3" data-id="${c.id}">${c.nome}</span>`
      ).join("");
      box.querySelectorAll(".chip-cat").forEach(chip => {
        chip.onclick = () => {
          const id = Number(chip.dataset.id);
          categoriaAtiva = categoriaAtiva === id ? null : id;
          box.querySelectorAll(".chip-cat").forEach(c => c.classList.toggle("active", Number(c.dataset.id) === categoriaAtiva));
          pesquisar();
        };
      });
    }

    async function pesquisar() {
      const q = document.getElementById("pesquisa").value.trim();
      const params = new URLSearchParams();
      if (q) params.set("q", q);
      if (categoriaAtiva) params.set("categoria", categoriaAtiva);

      const resultado = document.getElementById("resultado");
      const profissionais = await apiFetch(`/profissionais?${params}`, { auth: false });

      resultado.innerHTML = profissionais.length ? profissionais.map(p => `
        <div class="col-12 col-sm-6 col-lg-4">
          <a href="perfil.html?id=${p.id}" class="card card-femme h-100 text-decoration-none text-dark p-3">
            <div class="avatar-placeholder mb-2"></div>
            <div class="fw-semibold">${p.nome_negocio}</div>
            <div class="text-muted small">${p.categoria || ""} · ${p.localizacao || ""}</div>
            <div class="mt-2" style="color:var(--femme-gold);">
              ${"★".repeat(Math.round(p.classificacao_media)) || "☆"}
              <span class="text-muted small">(${p.total_avaliacoes})</span>
            </div>
          </a>
        </div>
      `).join("") : `<p class="text-muted">Nenhum profissional encontrado.</p>`;
    }

    document.getElementById("pesquisa").addEventListener("input", () => {
      clearTimeout(window._t);
      window._t = setTimeout(pesquisar, 250);
    });

    carregarCategorias();
    pesquisar();
  </script>
</body>
</html>
