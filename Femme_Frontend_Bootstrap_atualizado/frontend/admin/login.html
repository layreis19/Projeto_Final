<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme Admin · Entrar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:#2A1420;">
  <main class="container py-5" style="max-width:360px;">
    <div class="text-center mb-4">
      <div class="small text-uppercase" style="letter-spacing:.1em;color:var(--femme-gold);">🔒 Acesso restrito</div>
      <h1 class="font-display h3 text-white mt-2 mb-0">Femme Admin</h1>
      <p class="text-white-50 small">painel de administração da plataforma</p>
    </div>

    <div id="msgBox"></div>
    <form id="loginForm" class="card p-4" style="background:#3A2430;border:1px solid rgba(246,241,233,.15);">
      <div class="mb-3">
        <label class="form-label small text-white-50">Email de administrador</label>
        <input type="email" id="email" class="form-control" style="background:#2E1B25;border-color:#55404A;color:#F6F1E9;" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-white-50">Palavra-passe</label>
        <input type="password" id="password" class="form-control" style="background:#2E1B25;border-color:#55404A;color:#F6F1E9;" required>
      </div>
      <button class="btn btn-gold w-100" type="submit">Entrar</button>
    </form>
    <p class="text-white-50 small text-center mt-4" style="max-width:260px;margin:1rem auto 0;">
      Este diretório (/admin) é separado da aplicação pública e não é acessível a clientes ou profissionais.
    </p>
    <p class="text-white-50 small text-center mt-3">Demo: admin@femme.pt / admin123</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msgBox = document.getElementById("msgBox");
      try {
        const data = await apiFetch("/auth/login", { method: "POST", auth: false,
          body: { email: email.value, password: password.value } });
        if (data.utilizador.tipo !== "admin") {
          alertaErro(msgBox, "Esta conta não tem acesso de administração.");
          return;
        }
        Sessao.guardar(data.token, data.utilizador);
        window.location.href = "aprovacoes.html";
      } catch (err) { alertaErro(msgBox, err.message); }
    });
  </script>
</body>
</html>
