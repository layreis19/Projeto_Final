<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme Admin · Aprovações</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-shell">
  <nav class="navbar navbar-expand-md navbar-admin">
    <div class="container">
      <a class="navbar-brand" href="aprovacoes.html">Femme Admin</a>
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="nav-link fw-semibold" href="aprovacoes.html">Aprovações</a>
        <a class="nav-link" href="avaliacoes.html">Avaliações</a>
        <a class="nav-link" href="utilizadores.html">Utilizadores</a>
        <span id="userBox" class="text-white-50"></span>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="font-display">Aprovação de profissionais</h1>
    <div id="msgBox"></div>
    <div class="card card-femme"><div id="lista" class="list-group list-group-flush"></div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script>
    const user = Sessao.exigirTipo("admin", "login.html");
    document.getElementById("userBox").innerHTML = `Olá, ${user.nome} · <a href="#" id="logoutLink" class="text-white-50">sair</a>`;
    document.getElementById("logoutLink").onclick = () => { Sessao.terminar(); location.href = "login.html"; };

    async function carregar() {
      const pendentes = await apiFetch("/admin/aprovacoes");
      document.getElementById("lista").innerHTML = pendentes.length ? pendentes.map(p => `
        <div class="list-group-item d-flex align-items-center gap-3">
          <div class="avatar-placeholder" style="width:34px;height:34px;"></div>
          <div class="flex-grow-1">
            <div class="fw-semibold">${p.nome_negocio}</div>
            <div class="small text-muted">${p.categoria || ""} · ${p.localizacao || ""}</div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="aprovar(${p.id})">Aprovar</button>
          <button class="btn btn-outline-primary btn-sm" onclick="rejeitar(${p.id})">Rejeitar</button>
        </div>
      `).join("") : `<div class="list-group-item text-muted">Sem perfis pendentes de momento.</div>`;
    }

    async function aprovar(id) {
      await apiFetch(`/admin/profissionais/${id}/aprovar`, { method: "PUT" });
      carregar();
    }
    async function rejeitar(id) {
      await apiFetch(`/admin/profissionais/${id}/rejeitar`, { method: "PUT" });
      carregar();
    }

    carregar();
  </script>
</body>
</html>
