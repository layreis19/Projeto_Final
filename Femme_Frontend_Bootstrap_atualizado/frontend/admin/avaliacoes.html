<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Femme Admin · Avaliações</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-shell">
  <nav class="navbar navbar-expand-md navbar-admin">
    <div class="container">
      <a class="navbar-brand" href="aprovacoes.html">Femme Admin</a>
      <div class="d-flex gap-3 align-items-center ms-auto">
        <a class="nav-link" href="aprovacoes.html">Aprovações</a>
        <a class="nav-link fw-semibold" href="avaliacoes.html">Avaliações</a>
        <a class="nav-link" href="utilizadores.html">Utilizadores</a>
        <span id="userBox" class="text-white-50"></span>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="font-display">Moderação de avaliações</h1>
    <p class="text-muted small mb-4">Só chegam aqui avaliações de marcações concluídas.</p>
    <div id="msgBox"></div>
    <div class="card card-femme"><div id="lista" class="list-group list-group-flush"></div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script>
    const user = Sessao.exigirTipo("admin", "login.html");
    document.getElementById("userBox").innerHTML = `Olá, ${user.nome}`;

    async function carregar() {
      const pendentes = await apiFetch("/admin/avaliacoes");
      document.getElementById("lista").innerHTML = pendentes.length ? pendentes.map(a => `
        <div class="list-group-item d-flex align-items-center gap-3">
          <div class="flex-grow-1">
            <div class="fw-semibold small">${a.cliente_nome}</div>
            <div style="color:var(--femme-gold);">${"★".repeat(a.classificacao)}${"☆".repeat(5-a.classificacao)}</div>
            <div class="small text-muted">${a.comentario || ""}</div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="publicar(${a.id})">Publicar</button>
          <button class="btn btn-outline-primary btn-sm" onclick="rejeitar(${a.id})">Rejeitar</button>
        </div>
      `).join("") : `<div class="list-group-item text-muted">Sem avaliações pendentes de momento.</div>`;
    }

    async function publicar(id) {
      await apiFetch(`/admin/avaliacoes/${id}/publicar`, { method: "PUT" });
      carregar();
    }
    async function rejeitar(id) {
      await apiFetch(`/admin/avaliacoes/${id}/rejeitar`, { method: "PUT" });
      carregar();
    }

    carregar();
  </script>
</body>
</html>
